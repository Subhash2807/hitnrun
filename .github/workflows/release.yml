# Builds the installers and attaches them to a GitHub Release.
# Triggered by pushing a version tag:  git tag v1.3.0 && git push origin v1.3.0
# Can also be run by hand from the Actions tab (builds only, no release).

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            files: release/*.exe
          - os: macos-latest          # Apple Silicon runner
            target: --mac --arm64
            files: release/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Unsigned build: stop electron-builder hunting for a certificate.
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: hitnrun-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          # v1.6.0-beta.1 and the like are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
